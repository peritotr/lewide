name: Release

# Pushing a tag such as v0.1.0 builds the installers for every system and
# attaches them to a draft release with that name. The draft is published by
# hand after the installers have been checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installers:
    # On the job, as in tauri-action's own example: creating the release needs it.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app checks them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json, which the app reads to learn about a new version.
          includeUpdaterJson: true
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: LewIDE ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Download the installer for your system below.

            | System | File |
            |---|---|
            | macOS, Apple silicon (M1 and later) | `LewIDE_…_aarch64.dmg` |
            | macOS, Intel | `LewIDE_…_x64.dmg` |
            | Windows | `LewIDE_…_x64-setup.exe` (or the `.msi`) |
            | Linux | `.AppImage`, `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, openSUSE) |

            These builds are not signed with a paid developer certificate yet, so the system warns on first launch:

            - **macOS:** open the app once, then System Settings → Privacy & Security → "Open Anyway".
            - **Windows:** SmartScreen shows "Windows protected your PC"; choose More info → Run anyway.
