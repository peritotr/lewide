[package]
name = "dbclient-driver-sqlite"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
