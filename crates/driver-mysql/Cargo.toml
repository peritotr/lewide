[package]
name = "dbclient-driver-mysql"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "ring", "rustls-tls", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
