[package]
name = "dbclient-driver-sqlserver"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
dbclient-core = { version = "0.1.0", path = "../core" }
futures-util = "0.3.34"
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "rust_decimal", "chrono", "time"] }
tokio = { version = "1.54.1", features = ["net", "sync", "rt", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
