[package]
name = "dbclient-tunnel"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "time", "sync"] }

[dev-dependencies]
dbclient-driver-mysql = { path = "../driver-mysql" }
dbclient-driver-postgres = { path = "../driver-postgres" }
dbclient-store = { path = "../store" }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tokio-postgres = { version = "0.7.18", default-features = false }
