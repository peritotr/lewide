[package]
name = "dbclient-driver-postgres"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.12"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
