[package]
name = "dbclient-driver-elasticsearch"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
dbclient-tls = { version = "0.1.0", path = "../tls" }
# HTTP/1.1 only, as for Qdrant, Neo4j and ClickHouse: the REST API needs nothing more.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
