[package]
name = "dbclient-ai"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dbclient-core = { version = "0.1.0", path = "../core" }
dbclient-store = { version = "0.1.0", path = "../store" }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
dbclient-driver-sqlite = { path = "../driver-sqlite" }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
wiremock = "0.6.5"
