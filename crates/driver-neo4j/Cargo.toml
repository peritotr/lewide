[package]
name = "dbclient-driver-neo4j"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
dbclient-core = { version = "0.1.0", path = "../core" }
dbclient-tls = { version = "0.1.0", path = "../tls" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net"] }
