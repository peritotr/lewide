[package]
name = "dbclient-driver-qdrant"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
dbclient-tls = { version = "0.1.0", path = "../tls" }
futures-util = "0.3.34"
# HTTP/1.1 only: the REST API needs nothing more, and it keeps HTTP/2 out of this crate.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
