[package]
name = "dbclient-driver-duckdb"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
dbclient-core = { version = "0.1.0", path = "../core" }
# Built from the source the crate carries (no download at build or run time),
# with the Parquet and JSON readers inside. ICU (time zone names) is left out to keep the app smaller.
duckdb = { version = "1.20001.0", default-features = false, features = ["bundled", "parquet", "json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
