[package]
name = "dbclient-driver-influxdb"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
# HTTP/1.1 only, as for ClickHouse: the HTTP API needs nothing more.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
webpki-roots = "1.0.12"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
