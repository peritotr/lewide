[package]
name = "dbclient-driver-redis"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
dbclient-tls = { version = "0.1.0", path = "../tls" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
