[package]
name = "dbclient-driver-redis"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
dbclient-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
